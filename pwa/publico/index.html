<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roxin</title>
<meta name="theme-color" content="#0f0c16">
<link rel="manifest" href="manifest.json">
<!-- sem isto o iPhone abre com a barra do Safari em cima e não parece um app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roxin">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone-180.png">
<style>
  /* A paleta é a mesma do BRANDING.md do app de mesa. Nada novo foi inventado. */
  :root{
    --noite:#0f0c16; --painel:#181425; --divisao:#272033;
    --pena:#e9e5ef; --pena-fraca:#8f88a3;
    --roxo:#a77cf0; --roxo-claro:#bb97f6; --luar:#6d5f9e;
    --topo: env(safe-area-inset-top); --baixo: env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:var(--noite); color:var(--pena);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    /* o dedo não deve "puxar a página": isto é um app, não um site */
    overscroll-behavior:none; user-select:none; -webkit-user-select:none;
  }
  .serif{font-family:Georgia,"Times New Roman",serif}

  /* Esconder é pelo atributo `hidden`, e o seletor leva o id junto para ganhar
     das regras de display logo abaixo — especificidade resolve, sem precisar de
     marcador de prioridade (que é proibido neste cofre). */
  #cabeca[hidden],#vazio[hidden],#lista[hidden],#rodape[hidden],#aviso[hidden]{display:none}

  #tela{display:flex;flex-direction:column;height:100%}

  #cabeca{
    background:var(--painel); border-bottom:1px solid var(--divisao);
    padding:calc(var(--topo) + 10px) 12px 10px; display:flex;
    align-items:center; gap:10px; flex-shrink:0;
  }
  #cabeca .marca{width:26px;height:26px;flex-shrink:0}
  #cabeca .qual{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
  #cabeca .qual b{font:19px Georgia,serif;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #cabeca .qual small{color:var(--pena-fraca);font-size:11.5px}
  #cabeca button{
    background:none;border:0;color:var(--pena-fraca);padding:8px;
    font-size:20px;line-height:1;cursor:pointer
  }

  #lista{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
  .faixa{display:flex;align-items:center;gap:12px;padding:7px 12px;cursor:pointer}
  .faixa:active{background:var(--painel)}
  .faixa.tocando .nome{color:var(--roxo)}
  .capinha{width:40px;height:40px;border-radius:6px;flex-shrink:0;background:var(--painel);object-fit:cover}
  .faixa .nome{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
  .faixa .dur{color:var(--pena-fraca);font-size:12.5px;font-variant-numeric:tabular-nums}

  #rodape{
    background:var(--painel);border-top:1px solid var(--divisao);flex-shrink:0;
    padding-bottom:var(--baixo)
  }
  #barra{height:2px;background:var(--divisao)}
  #barra i{display:block;height:100%;background:var(--roxo);width:0}
  #rodape .linha{display:flex;align-items:center;gap:11px;padding:8px 10px}
  #rodape .capinha{width:46px;height:46px}
  #rodape .txt{flex:1;min-width:0}
  #rodape .txt b{display:block;font-weight:400;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #rodape .txt small{color:var(--pena-fraca);font-size:11px}
  #rodape button{background:none;border:0;color:var(--roxo);font-size:24px;padding:6px 8px;cursor:pointer}

  /* tela de boas-vindas, quando não há música nenhuma */
  #vazio{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;gap:14px}
  #vazio svg{width:86px;height:86px}
  #vazio h1{font:30px Georgia,serif;font-weight:400;margin:6px 0 0}
  #vazio p{color:var(--pena-fraca);line-height:1.6;margin:0;max-width:34ch}
  .botao{
    background:var(--roxo);color:var(--noite);border:0;border-radius:24px;
    padding:13px 22px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px
  }

  dialog{
    border:0;border-radius:16px;background:var(--painel);color:var(--pena);
    padding:22px;max-width:86vw;width:340px
  }
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog h2{font:19px Georgia,serif;font-weight:400;margin:0 0 12px}
  dialog p{color:var(--pena-fraca);font-size:13.5px;line-height:1.5}
  progress{width:100%;height:5px;accent-color:var(--roxo)}
  .itemLista{
    display:flex;justify-content:space-between;gap:12px;padding:11px 4px;
    border-bottom:1px solid var(--divisao);cursor:pointer
  }
  .itemLista b{font:15px Georgia,serif;font-weight:400}
  .itemLista.aberta b{color:var(--roxo)}
  .itemLista span{color:var(--pena-fraca);font-size:13px}

  #aviso{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--baixo));
    background:var(--painel);border:1px solid var(--divisao);color:var(--pena);
    padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:9;max-width:88vw;text-align:center
  }
</style>
</head>
<body>
<div id="tela">
  <div id="cabeca" hidden>
    <svg class="marca" viewBox="0 0 100 100"><use href="#passaro"/></svg>
    <div class="qual" id="trocar">
      <b id="nomeLista">Todas as músicas</b>
      <small id="contaLista">0 músicas</small>
    </div>
    <button id="btBusca" aria-label="Buscar">⌕</button>
    <button id="btTrazer" aria-label="Trazer músicas">＋</button>
  </div>

  <div id="vazio">
    <svg viewBox="0 0 100 100"><use href="#passaro"/></svg>
    <h1 class="serif">Roxin</h1>
    <p>Nenhuma música aqui ainda.<br><br>
       No PC, gere o pacote da playlist e suba no Drive. No celular, baixe o
       arquivo <b>.zip</b> e toque no botão abaixo.</p>
    <button class="botao" id="btPrimeiro">Escolher o pacote</button>
    <p id="espaco" style="font-size:12px"></p>
  </div>

  <div id="lista" hidden></div>

  <div id="rodape" hidden>
    <div id="barra"><i id="barraCheia"></i></div>
    <div class="linha">
      <img class="capinha" id="rCapa" alt="">
      <div class="txt">
        <b id="rNome"></b>
        <small id="rLista"></small>
      </div>
      <button id="btAnterior" aria-label="Anterior">⏮</button>
      <button id="btTocar" aria-label="Tocar">▶</button>
      <button id="btProxima" aria-label="Próxima">⏭</button>
    </div>
  </div>
</div>

<div id="aviso" hidden></div>
<input type="file" id="arquivo" accept=".zip,application/zip" hidden>

<dialog id="dImport">
  <h2>Trazendo as músicas</h2>
  <progress id="pImport" max="100" value="0"></progress>
  <p id="tImport">abrindo o pacote…</p>
</dialog>

<dialog id="dListas"><h2>Suas listas</h2><div id="listasBox"></div></dialog>

<!-- o pássaro: mesmo vetor do marca.py do app de mesa, traduzido para SVG -->
<svg style="display:none" aria-hidden="true">
  <symbol id="passaro" viewBox="0 0 100 100">
    <path fill="#a77cf0" d="M11 32 L26 28.5 L26 36.5 Z"/>
    <path fill="#a77cf0" d="M25 25 C33 15 49 20 54 34 C59 45 66 54 74 59
      L95 79 L87 83 C73 75 62 71 52 68 C37 64 26 54 24 43 C23 36 22 30 25 25 Z"/>
    <path fill="#7c5cb8" d="M33 38 C45 36 56 45 62 58 C52 56 40 50 33 38 Z"/>
    <circle cx="30" cy="30" r="2.6" fill="#0f0c16"/>
  </symbol>
</svg>

<script type="module" src="app.js"></script>
</body>
</html>
