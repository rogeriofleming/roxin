# Compila o Roxin para iPhone num Mac do GitHub — de graça.
#
# POR QUE ISTO EXISTE
# -------------------
# Compilar para iOS exige macOS e Xcode, e o Roger usa Windows. O repositório do
# Roxin é PÚBLICO, e para repositório público o GitHub dá runner macOS sem cobrar.
# Então o Mac é emprestado aqui, e o resultado é um .ipa que ele instala no
# iPhone com a conta Apple GRÁTIS dele — sem os US$ 99/ano.
#
# O .ipa sai SEM ASSINATURA de propósito (`--no-codesign`). Quem assina é o
# AltStore/SideStore/Sideloadly na máquina dele, com o Apple ID comum. Assinar
# aqui exigiria certificado de desenvolvedor, que é justamente o que custa.
#
# ⚠️ O QUE ISTO NÃO RESOLVE: app assinado com conta grátis PARA DE ABRIR em 7
# dias. Isso é regra da Apple, não falha do build. O jeito de conviver está em
# IPHONE.md, na raiz do repositório.

name: iPhone (.ipa sem assinatura, para sideload)

on:
  workflow_dispatch: # roda quando alguém manda rodar
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/ios.yml"

jobs:
  ipa:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Pegar o código
        uses: actions/checkout@v4

      - name: Instalar o Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Conferir o Flutter
        run: flutter --version

      - name: Dependências
        working-directory: mobile
        run: flutter pub get

      - name: Analisador (não deixa passar código quebrado)
        working-directory: mobile
        run: flutter analyze

      - name: Testes de motor
        working-directory: mobile
        run: flutter test

      # Os plugins iOS do Flutter 3.47 sao SWIFT PACKAGES, nao CocoaPods.
      # Nao ha Podfile, nao ha pod install: o `flutter build` resolve os pacotes
      # sozinho e LINKA os plugins dentro do binario Runner -- por isso eles nao
      # aparecem como pasta .framework, e a conferencia adiante procura simbolo.
      - name: Build iOS sem assinatura
        working-directory: mobile
        run: flutter build ios --release --no-codesign

      # Quem REALMENTE foi registrado esta aqui. Em 27/09/2026 o lado Dart do
      # path_provider estava no app e o lado NATIVO nao -- o que daria
      # MissingPluginException na primeira coisa que o Roxin faz (achar a pasta
      # da biblioteca). Este passo mostra o fato em vez de me deixar teorizar.
      - name: Quais plugins o Flutter registrou
        working-directory: mobile
        run: |
          echo "--- GeneratedPluginRegistrant ---"
          find ios -name "GeneratedPluginRegistrant*" -print -exec cat {} \; | head -60
          echo "--- plugins iOS em .flutter-plugins-dependencies ---"
          python3 -c "import json;d=json.load(open('.flutter-plugins-dependencies'));[print('  ',p['name'],'->',p.get('path','')[:60]) for p in d['plugins']['ios']]"
          echo "--- pacotes Swift gerados ---"
          find ios -name "Package.swift" -print -exec cat {} \; | head -40

      - name: Empacotar em .ipa
        working-directory: mobile/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry Roxin.ipa Payload
          ls -lh Roxin.ipa

      - name: Conferir que o .ipa tem o que precisa
        working-directory: mobile/build/ios/iphoneos
        run: |
          set -e
          PLIST=Payload/Runner.app/Info.plist
          echo "--- checando as chaves que fazem o app funcionar ---"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :UIFileSharingEnabled" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :LSSupportsOpeningDocumentsInPlace" "$PLIST"
          # som em segundo plano é o requisito nº 1: se sumir, o build falha aqui
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" | grep -q audio
          echo "OK: audio em segundo plano, pasta no app Arquivos"

          echo "--- o que existe em Frameworks/ (informativo) ---"
          ls -1 Payload/Runner.app/Frameworks/ 2>/dev/null || echo "(sem pasta Frameworks)"

          echo "--- os plugins nativos entraram no binario? ---"
          # Plugin via Swift Package e LINKADO dentro do Runner, nao vira pasta.
          # Entao cobro o nome EXATO da classe de cada plugin. Nome parcial nao
          # serve: em 27/09/2026 procurei "AudioPlayer" e casei com simbolo do
          # proprio iOS, o que me fez comemorar um .ipa que estava vazio.
          FALTOU=0
          # PathProviderPlugin NAO entra nesta lista, e o motivo importa: o
          # path_provider_foundation tem native_build=false -- ele nao e plugin
          # nativo, chama as APIs do iOS por FFI atraves do objective_c.framework.
          # Cobrar a classe dele foi o que me fez gritar defeito onde nao havia,
          # em 27/09/2026, e me custou uma volta inteira pelo CocoaPods.
          for S in JustAudioPlugin AudioServicePlugin AudioSessionPlugin FilePickerPlugin PermissionHandlerPlugin; do
            if strings -a Payload/Runner.app/Runner | grep -qx "$S"; then
              echo "  OK    $S"
            else
              echo "  FALTA $S"
              FALTOU=1
            fi
          done
          if [ "$FALTOU" = "1" ]; then
            echo "::error::plugin nativo faltando -- o app abriria sem som. Ver o log do build."
            exit 1
          fi
          # o path_provider anda por aqui: sem este framework, achar a pasta da
          # biblioteca falha no celular
          if [ -d Payload/Runner.app/Frameworks/objective_c.framework ]; then
            echo "  OK    objective_c.framework (e por ele que o path_provider funciona)"
          else
            echo "::error::objective_c.framework faltando -- o path_provider nao teria como achar a pasta da biblioteca."
            exit 1
          fi

          echo "--- tamanho do binario (com os plugins dentro) ---"
          ls -lh Payload/Runner.app/Runner

      - name: Guardar o .ipa
        if: always()   # tambem quando a conferencia reprova: e o que eu abro para investigar
        uses: actions/upload-artifact@v4
        with:
          name: Roxin-iphone-ipa
          path: mobile/build/ios/iphoneos/Roxin.ipa
          retention-days: 90
          if-no-files-found: error
